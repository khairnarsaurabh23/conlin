name: Build APK

on:
  push:
    branches-ignore: [apk-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JobPilot-apk
          path: |
            app/build/outputs/apk/release/*.apk
            build.log
      - name: Publish APK and log to apk-build branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ || true
          cp app/build/outputs/apk/release/*.apk /tmp/out/JobPilot.apk 2>/dev/null || true
          echo "${{ steps.build.outcome }}" > /tmp/out/status.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk-build
          git rm -rf . > /dev/null
          rm -rf ./* .gradle 2>/dev/null || true
          cp /tmp/out/* .
          git add -A
          git commit -m "Build output for ${GITHUB_SHA}"
          git push -f origin apk-build
      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
